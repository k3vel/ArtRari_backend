spring.application.name=ArtRari

#DATABASE
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:artrari}
spring.datasource.username=${POSTGRES_USERNAME:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database=postgresql
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/core,classpath:db/migration/dev

#JWT
jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPIRATION:14400000}

#CLOUDINARY
cloudinary.url=${CLOUDINARY_URL}

#FILE RESTRICTIONS
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

#PAGINATION
app.pagination.default-size=12

#CACHING
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

#ANTI-SNIPER
anti-sniper.threshold-minutes=10
anti-sniper.extension-seconds=600
anti-sniper.shift-threshold-seconds=15
anti-sniper.max-retry-attempts=3
anti-sniper.retry-after-ms=50

#RATE LIMIT
app.rate-limit.capacity=50
app.rate-limit.refill-minutes=1
app.rate-limit.expiration-seconds=10

#SCHEDULERS
app.scheduler.auction-open-rate-ms=60000
app.scheduler.auction-close-rate-ms=10000
app.scheduler.lot-close-rate-ms=10000